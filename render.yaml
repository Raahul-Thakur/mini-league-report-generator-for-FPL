# Render Blueprint for the API. In Render: New > Blueprint > pick this repo.
# The website (web/) deploys separately on Vercel.
services:
  - type: web
    name: mini-league-report-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Starter avoids the free plan's sleep-after-inactivity (~50 s cold starts).
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    # Only redeploy when the API changes, not the website
    buildFilter:
      paths:
        - app/**
        - requirements.txt
        - Dockerfile
    envVars:
      # Shared secret with the website. Render generates it; copy the value into
      # Vercel's INTERNAL_API_KEY. Leaving it unset makes the API publicly callable.
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: MAX_ENTRIES
        value: "50"
      - key: RATE_LIMIT_REPORT
        value: 30/minute
      - key: RATE_LIMIT_CARD
        value: 120/minute
      # Branding on the cards: set these in the dashboard
      - key: BRAND_SITE_NAME
        sync: false
      - key: BRAND_HANDLE
        sync: false
      - key: BRAND_SITE_URL
        sync: false
      - key: BRAND_PRIMARY
        sync: false
      - key: BRAND_ACCENT
        sync: false
